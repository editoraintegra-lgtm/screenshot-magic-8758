name: Build Project

on:
push:
branches: [ main ]

jobs:
build:
runs-on: ubuntu-latest
steps:
- uses: actions/checkout@v4
- uses: actions/setup-node@v4
with:
node-version: 18
- run: npm install --legacy-peer-deps
- run: npx vite build
- uses: actions/upload-artifact@v4
with:
name: dist-build
path: dist/
