name: Build Project
on:
  push: 
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - run: bun install
      - name: Build project
      - run: bun run build
        env:
           NITRO_PRESET: static

      - uses: actions/upload-artifact@v4
        with:
          name: dist-build
          path: .output/public/
